
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SS TUNA - Scale the Depths</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      color: #000;
    }

    #game-wrapper {
      position: relative;
      border: 4px solid #0f172a;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background: #38bdf8;
      line-height: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      cursor: crosshair;
      width: 100%;
      max-width: 420px;
      height: auto;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-box {
      background: #ffffff;
      border: 3px solid #0f172a;
      border-radius: 8px;
      padding: 4px 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 3px 3px 0 #0f172a;
    }

    .hearts {
      display: flex;
      gap: 4px;
    }

    .heart {
      width: 14px;
      height: 12px;
      background: #ef4444;
      clip-path: path('M7 12 L0 4 Q0 0 3.5 0 Q7 0 7 3.5 Q7 0 10.5 0 Q14 0 14 4 Z');
    }

    .heart.empty {
      background: #cbd5e1;
    }

    #score-box {
      text-align: center;
    }

    #score {
      font-size: 15px;
      color: #15803d;
    }

    #depth-label {
      font-size: 10px;
      color: #334155;
      margin-top: 2px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      background: #f59e0b;
      border: 3px solid #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #000;
      font-weight: bold;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 3px 3px 0 #0f172a;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(56, 189, 248, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    #overlay h2 {
      font-size: 2.2rem;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0 #fff;
    }

    #overlay p {
      margin-bottom: 16px;
      font-size: 0.85rem;
      line-height: 1.4;
      font-weight: bold;
    }

    button {
      background: #ea580c;
      color: #fff;
      border: 3px solid #0f172a;
      padding: 10px 24px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 3px 3px 0 #0f172a;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #0f172a;
    }

    #shop {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      padding: 10px;
      display: none;
      z-index: 15;
      border-top: 4px solid #0f172a;
    }

    #shop h3 {
      font-size: 12px;
      color: #0f172a;
      margin-bottom: 8px;
      text-align: center;
    }

    .shop-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .shop-btn {
      background: #f1f5f9;
      border: 2px solid #0f172a;
      color: #0f172a;
      padding: 6px 8px;
      font-size: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      min-width: 85px;
      text-align: center;
      box-shadow: 2px 2px 0 #0f172a;
    }

    .shop-btn .price {
      color: #15803d;
      display: block;
      font-size: 10px;
      font-weight: bold;
    }

    #hint {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 0.75rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="game-wrapper">
    <canvas id="game" width="420" height="640"></canvas>
    <div id="ui">
      <div class="hud-box">
        <div class="hearts" id="hearts"></div>
      </div>
      <div class="hud-box" id="score-box">
        <div>
          <div id="score">$ 0</div>
          <div id="depth-label">0m</div>
        </div>
      </div>
      <div class="right-ui">
        <div class="btn-icon" id="btnShop" title="Loja">🛒</div>
      </div>
    </div>
    <div id="shop">
      <h3>EQUIPAMENTOS DE PESCA</h3>
      <div class="shop-row">
        <button class="shop-btn" id="upLine">Linha +<span class="price">$25</span></button>
        <button class="shop-btn" id="upHook">Anzol +<span class="price">$40</span></button>
        <button class="shop-btn" id="upSpeed">Velocidade<span class="price">$30</span></button>
        <button class="shop-btn" id="upLuck">Sorte<span class="price">$50</span></button>
      </div>
    </div>
    <div id="overlay">
      <h2>SS TUNA</h2>
      <p style="opacity:0.8;">Simulador Realista de Pesca</p>
      <p>Clique/Toque para soltar a linha.<br><b>Mova o cursor/dedo na água</b> para guiar o anzol!<br><br>
        Colete peixes e desvie dos perigos.
      </p>
      <button id="startBtn">PESCAR</button>
    </div>
  </div>
  <div id="hint">
    Mova o mouse/dedo lateralmente para controlar o anzol na água
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const depthEl = document.getElementById('depth-label');
    const heartsEl = document.getElementById('hearts');
    const shopEl = document.getElementById('shop');

    let running = false;
    let money = 0;
    let lives = 3;
    let frame = 0;
    let shopOpen = false;

    let lineMaxDepth = 280;
    let hookSize = 10;
    let dropSpeed = 2.8;
    let reelSpeed = 3.6;
    let moveSpeed = 3.5;
    let luck = 1;

    let lineState = 'ready';
    let lineY = 0;
    let caughtFish = null;

    let hookX = 210;
    let targetX = 210;

    let camY = 0;

    let fishes = [];
    let obstacles = [];
    let particles = [];
    let bubbles = [];

    const boat = { x: 155, y: 125 };

    const FISH_TYPES = [
      { name: 'Sardinha', minD: 20, maxD: 120, value: 3, color: '#3b82f6', belly: '#93c5fd', w: 22, h: 10, rare: 0 },
      { name: 'Atum', minD: 80, maxD: 220, value: 8, color: '#1e3a8a', belly: '#60a5fa', w: 30, h: 14, rare: 0 },
      { name: 'Salmão', minD: 140, maxD: 320, value: 15, color: '#f97316', belly: '#fed7aa', w: 28, h: 13, rare: 0.15 },
      { name: 'Peixe-lua', minD: 250, maxD: 450, value: 28, color: '#eab308', belly: '#fef08a', w: 32, h: 22, rare: 0.35 },
      { name: 'Lula', minD: 300, maxD: 520, value: 40, color: '#a855f7', belly: '#e9d5ff', w: 24, h: 28, rare: 0.5 },
      { name: 'Tubarão', minD: 400, maxD: 700, value: 70, color: '#475569', belly: '#cbd5e1', w: 46, h: 18, rare: 0.65 },
      { name: 'Kraken', minD: 550, maxD: 900, value: 150, color: '#111827', belly: '#4b5563', w: 54, h: 36, rare: 0.85 }
    ];

    function px(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function drawBackground() {
      const surfaceY = 160 - camY;

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 0, canvas.width, Math.max(0, surfaceY));

      if (surfaceY > 0) {
        px(20, surfaceY - 110, 70, 18, '#ffffff');
        px(35, surfaceY - 120, 45, 10, '#ffffff');
        px(250, surfaceY - 130, 90, 22, '#ffffff');

        ctx.fillStyle = '#86efac';
        ctx.beginPath();
        ctx.arc(40, surfaceY, 35, Math.PI, 0);
        ctx.arc(380, surfaceY, 50, Math.PI, 0);
        ctx.fill();

        px(380, surfaceY - 28, 5, 28, '#78350f');
        px(368, surfaceY - 36, 28, 8, '#15803d');
      }

      const waterStart = Math.max(0, surfaceY);
      for (let i = 0; i < 25; i++) {
        const dy = waterStart + i * 26;
        if (dy > canvas.height) break;
        const depthFactor = Math.min(1, (camY + dy) / 850);
        const r = Math.floor(2 + (1 - depthFactor) * 12);
        const g = Math.floor(40 + (1 - depthFactor) * 110);
        const b = Math.floor(80 + (1 - depthFactor) * 120);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(0, dy, canvas.width, 28);
      }

      if (surfaceY > -20 && surfaceY < canvas.height) {
        ctx.fillStyle = '#bae6fd';
        for (let x = 0; x < canvas.width; x += 12) {
          ctx.fillRect(x + Math.sin(frame * 0.04 + x) * 3, surfaceY - 3, 8, 4);
        }
      }

      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '10px monospace';
      for (let d = 50; d <= 900; d += 50) {
        const my = d + 160 - camY;
        if (my > 10 && my < canvas.height - 10) {
          ctx.fillText(d + 'm', 12, my);
          px(0, my, canvas.width, 1, 'rgba(255,255,255,0.1)');
        }
      }
    }

    function drawBoat(x, y) {
      // Casco com detalhes
      px(x, y + 10, 110, 16, '#f8fafc');
      px(x + 5, y + 26, 100, 8, '#dc2626');
      px(x - 2, y + 8, 114, 3, '#0f172a');

      // Cabine
      px(x + 35, y - 20, 45, 30, '#64748b');
      px(x + 30, y - 25, 55, 6, '#334155');
      px(x + 45, y - 10, 12, 12, '#38bdf8');

      // Pescador Realista (Anatomia Pixelada)
      const pxX = x + 12;
      const pxY = y - 12;

      // Galochas / Pernas
      px(pxX + 2, pxY + 16, 5, 8, '#1e293b');
      px(pxX + 8, pxY + 16, 5, 8, '#1e293b');

      // Tronco e Jaqueta Amarela
      px(pxX, pxY + 4, 14, 13, '#f59e0b');
      px(pxX + 2, pxY + 6, 10, 10, '#d97706'); // Sombreamento no peito

      // Braços inclinados segurando a vara
      const armPull = (lineState === 'reeling' || lineState === 'caught') ? Math.sin(frame * 0.3) * 2 : 0;
      px(pxX - 4, pxY + 6 + armPull, 5, 10, '#f59e0b'); // Braço Esquerdo
      px(pxX + 11, pxY + 8, 4, 8, '#d97706'); // Braço Direito

      // Mãos (Tom de pele)
      px(pxX - 6, pxY + 14 + armPull, 3, 3, '#fed7aa');
      px(pxX + 12, pxY + 14, 3, 3, '#fed7aa');

      // Cabeça / Rosto
      px(pxX + 3, pxY - 3, 9, 8, '#fed7aa'); // Rosto
      px(pxX + 9, pxY, 2, 2, '#78350f'); // Olho olhando a água

      // Barba
      px(pxX + 3, pxY + 3, 8, 3, '#451a03');

      // Chapéu Amarelo de Pescador (Sout'wester)
      px(pxX + 1, pxY - 6, 13, 4, '#f59e0b');
      px(pxX - 2, pxY - 3, 18, 2, '#d97706'); // Aba do chapéu

      // Texto do Casco
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 7px monospace';
      ctx.fillText('SS TUNA', x + 55, y + 20);
    }

    function drawRod(x, y, tipX, tipY) {
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 10, y + 5);
      ctx.lineTo(x - 15, y - 20);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - 15, y - 20);
      ctx.lineTo(tipX, tipY);
      ctx.stroke();
    }

    function drawHook(hx, hy, size) {
      px(hx - 4, hy - 8, 8, 6, '#f97316');
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx, hy - 2);
      ctx.lineTo(hx, hy + size);
      ctx.stroke();
    }

    function drawFish(f) {
      const x = f.x, y = f.y - camY;
      if (y < -40 || y > canvas.height + 40) return;
      const dir = f.vx > 0 ? 1 : -1;
      ctx.save();

      if (dir < 0) {
        ctx.translate(x + f.w, y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(x, y);
      }

      const w = f.w;
      const h = f.h;
      const c = f.color;
      const b = f.belly || '#ffffff';

      if (f.name === 'Lula' || f.name === 'Kraken') {
        // Tentáculos
        const swimOffset = Math.sin(frame * 0.2) * 3;
        px(0, 4 + swimOffset, w * 0.4, 3, c);
        px(0, 10 - swimOffset, w * 0.4, 3, c);
        px(0, 16 + swimOffset, w * 0.4, 3, c);

        // Cabeça / Manto em Formato Realista
        px(w * 0.3, 2, w * 0.6, h - 4, c);
        px(w * 0.5, 0, w * 0.5, h, c);
        px(w * 0.8, 4, w * 0.2, h - 8, b); // Ponta

        // Olho Grande
        px(w * 0.4, 6, 4, 4, '#ffffff');
        px(w * 0.4 + 1, 7, 2, 2, '#0f172a');
      } else {
        // Cauda Articulada (Tail Fin)
        const tailOffset = Math.sin(frame * 0.25) * 2;
        px(0, 1 + tailOffset, 4, h - 2, c);
        px(3, 3 + tailOffset, 4, h - 6, c);

        // Corpo Oval/Anatômico
        px(6, 2, w - 8, h - 4, c);
        px(10, 0, w - 14, h, c);

        // Barriga com Sombreamento / Gradiente
        px(10, Math.floor(h * 0.55), w - 16, Math.ceil(h * 0.45), b);

        // Barbatanas DORSAL e PEITORAL
        px(Math.floor(w * 0.4), -3, 6, 3, c); // Dorsal
        px(Math.floor(w * 0.3), Math.floor(h * 0.5), 5, 3, '#cbd5e1'); // Peitoral

        // Detalhe de Escamas / Brilho
        px(Math.floor(w * 0.5), 3, 2, 2, 'rgba(255,255,255,0.6)');
        px(Math.floor(w * 0.6), 6, 2, 2, 'rgba(255,255,255,0.6)');

        // Olho Vivo
        px(w - 7, 3, 4, 4, '#ffffff');
        px(w - 6, 4, 2, 2, '#0f172a');
      }

      ctx.restore();
    }

    function drawObstacle(o) {
      const y = o.y - camY;
      if (y < -30 || y > canvas.height + 30) return;
      if (o.type === 'rock') {
        px(o.x, y, o.w, o.h, '#475569');
        px(o.x + 2, y + 2, o.w - 4, o.h - 4, '#64748b');
      } else {
        px(o.x, y, o.w, o.h, '#b91c1c');
        px(o.x + 3, y + 3, o.w - 6, o.h - 6, '#ef4444');
      }
    }

    function spawnFish() {
      const depth = camY + 150 + Math.random() * 400;
      const possible = FISH_TYPES.filter(t => depth >= t.minD && depth <= t.maxD);
      if (!possible.length) return;
      let type = possible[Math.floor(Math.random() * possible.length)];

      fishes.push({
        x: Math.random() < 0.5 ? -40 : canvas.width + 10,
        y: depth + 160,
        w: type.w, h: type.h,
        vx: (Math.random() * 1.2 + 0.6) * (Math.random() < 0.5 ? -1 : 1),
        color: type.color,
        belly: type.belly,
        value: type.value,
        name: type.name,
        caught: false
      });
    }

    function spawnObstacle() {
      const depth = camY + 200 + Math.random() * 350;
      obstacles.push({
        x: 30 + Math.random() * (canvas.width - 80),
        y: depth + 160,
        w: 24,
        h: 20,
        type: Math.random() < 0.6 ? 'rock' : 'mine'
      });
    }

    function spawnParticle(x, y, color, n = 6) {
      for (let i = 0; i < n; i++) {
        particles.push({
          x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 3 - 1,
          life: 15 + Math.random() * 12, color, size: 3
        });
      }
    }

    function update() {
      if (!running) return;
      frame++;

      if (lineState === 'dropping' || lineState === 'reeling' || lineState === 'caught') {
        const dx = targetX - hookX;
        hookX += Math.sign(dx) * Math.min(Math.abs(dx), moveSpeed);
        hookX = Math.max(20, Math.min(canvas.width - 20, hookX));
      }

      const targetCam = Math.max(0, lineY - 200);
      camY += (targetCam - camY) * 0.08;

      if (lineState === 'dropping') {
        lineY += dropSpeed;
        if (lineY >= lineMaxDepth) {
          lineY = lineMaxDepth;
          lineState = 'reeling';
        }
      } else if (lineState === 'reeling' || lineState === 'caught') {
        lineY -= reelSpeed * (caughtFish ? 0.75 : 1);
        if (lineY <= 0) {
          lineY = 0;
          if (caughtFish) {
            money += caughtFish.value;
            scoreEl.textContent = '$ ' + money;
            spawnParticle(hookX, 150, '#f59e0b', 10);
            caughtFish = null;
          }
          lineState = 'ready';
          camY = 0;
        }
      }

      if (frame % 40 === 0 && fishes.length < 15) spawnFish();
      if (frame % 110 === 0 && obstacles.length < 9) spawnObstacle();

      fishes = fishes.filter(f => {
        if (f.caught) return true;
        f.x += f.vx;
        if (f.x < -50 || f.x > canvas.width + 50) f.vx *= -1;

        if ((lineState === 'dropping' || lineState === 'reeling') && !caughtFish) {
          const hx = hookX, hy = lineY + 160 + hookSize;
          if (Math.abs(f.x + f.w / 2 - hx) < (f.w / 2 + hookSize) &&
            Math.abs(f.y + f.h / 2 - hy) < (f.h / 2 + 8)) {
            f.caught = true;
            caughtFish = f;
            lineState = 'caught';
            spawnParticle(f.x, f.y - camY, f.color, 8);
          }
        }
        return true;
      });

      if (caughtFish) {
        caughtFish.x = hookX - caughtFish.w / 2;
        caughtFish.y = lineY + 160 + hookSize + 4;
      }

      if (lineState === 'dropping' || lineState === 'reeling') {
        const hx = hookX, hy = lineY + 160;
        for (const o of obstacles) {
          if (hx > o.x && hx < o.x + o.w && hy > o.y && hy < o.y + o.h) {
            lives--;
            updateHearts();
            spawnParticle(hx, hy - camY, '#ef4444', 12);
            lineState = 'reeling';
            caughtFish = null;
            if (lives <= 0) gameOver();
            break;
          }
        }
      }

      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.life--; return p.life > 0;
      });
    }

    function draw() {
      drawBackground();
      obstacles.forEach(drawObstacle);
      fishes.forEach(f => { if (!f.caught) drawFish(f); });

      const boatScreenY = boat.y - Math.min(camY, 40);
      if (boatScreenY > -60) {
        drawBoat(boat.x, boatScreenY);
        const tipScreenY = 160 + lineY - camY;
        drawRod(boat.x, boatScreenY, hookX, Math.max(boatScreenY, tipScreenY - hookSize));
      }

      if (lineState !== 'ready' || lineY > 2) {
        const hy = 160 + lineY - camY;
        if (hy > -20 && hy < canvas.height + 20) {
          drawHook(hookX, hy, hookSize);
        }
      }

      if (caughtFish) drawFish(caughtFish);

      particles.forEach(p => {
        px(p.x, p.y, p.size, p.size, p.color);
      });

      depthEl.textContent = Math.floor(lineY) + 'm / ' + lineMaxDepth + 'm';

      if (lineState === 'ready' && running) {
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CLIQUE PARA PESCAR', canvas.width / 2, 80);
        ctx.textAlign = 'left';
      }
      if (caughtFish) {
        ctx.fillStyle = '#15803d';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('+' + caughtFish.value + ' ' + caughtFish.name, canvas.width / 2, 60);
        ctx.textAlign = 'left';
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      targetX = ((clientX - rect.left) / rect.width) * canvas.width;
    }

    function toggleLine() {
      if (!running || shopOpen) return;
      if (lineState === 'ready') {
        lineState = 'dropping';
        lineY = 0;
        caughtFish = null;
      } else if (lineState === 'dropping') {
        lineState = 'reeling';
      }
    }

    function updateHearts() {
      heartsEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('div');
        h.className = 'heart' + (i >= lives ? ' empty' : '');
        heartsEl.appendChild(h);
      }
    }

    function gameOver() {
      running = false;
      lineState = 'ready';
      overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p>Sua linha se rompeu!<br>Total Ganho: <strong>$ ${money}</strong></p>
        <button id="restartBtn">JOGAR NOVAMENTE</button>
      `;
      overlay.style.display = 'flex';
      document.getElementById('restartBtn').onclick = startGame;
    }

    function startGame() {
      money = 0; lives = 3; frame = 0;
      lineMaxDepth = 280; hookSize = 10; dropSpeed = 2.8; reelSpeed = 3.6; moveSpeed = 3.5; luck = 1;
      lineState = 'ready'; lineY = 0; caughtFish = null; camY = 0;
      hookX = 210; targetX = 210;
      fishes = []; obstacles = []; particles = []; bubbles = [];
      prices.line = 25; prices.hook = 40; prices.speed = 30; prices.luck = 50;
      scoreEl.textContent = '$ 0';
      updateHearts();
      updateShopPrices();
      overlay.style.display = 'none';
      shopEl.style.display = 'none';
      shopOpen = false;
      running = true;
    }

    const prices = { line: 25, hook: 40, speed: 30, luck: 50 };
    function updateShopPrices() {
      document.getElementById('upLine').innerHTML = `Linha +20m<span class="price">$${prices.line}</span>`;
      document.getElementById('upHook').innerHTML = `Anzol +<span class="price">$${prices.hook}</span>`;
      document.getElementById('upSpeed').innerHTML = `Velocidade<span class="price">$${prices.speed}</span>`;
      document.getElementById('upLuck').innerHTML = `Sorte<span class="price">$${prices.luck}</span>`;
    }

    function buy(type) {
      if (type === 'line' && money >= prices.line) {
        money -= prices.line; lineMaxDepth += 20; prices.line = Math.floor(prices.line * 1.5);
      } else if (type === 'hook' && money >= prices.hook) {
        money -= prices.hook; hookSize += 3; prices.hook = Math.floor(prices.hook * 1.6);
      } else if (type === 'speed' && money >= prices.speed) {
        money -= prices.speed; dropSpeed += 0.4; reelSpeed += 0.5; moveSpeed += 0.8; prices.speed = Math.floor(prices.speed * 1.5);
      } else if (type === 'luck' && money >= prices.luck) {
        money -= prices.luck; luck += 0.35; prices.luck = Math.floor(prices.luck * 1.7);
      }
      scoreEl.textContent = '$ ' + money;
      updateShopPrices();
    }

    document.getElementById('upLine').onclick = () => buy('line');
    document.getElementById('upHook').onclick = () => buy('hook');
    document.getElementById('upSpeed').onclick = () => buy('speed');
    document.getElementById('upLuck').onclick = () => buy('luck');

    document.getElementById('btnShop').onclick = () => {
      shopOpen = !shopOpen;
      shopEl.style.display = shopOpen ? 'block' : 'none';
    };

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); toggleLine(); }
      if (e.key === 'ArrowLeft') targetX -= 20;
      if (e.key === 'ArrowRight') targetX += 20;
    });

    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('touchmove', handlePointerMove, { passive: true });

    canvas.addEventListener('mousedown', toggleLine);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); toggleLine(); }, { passive: false });

    startBtn.onclick = startGame;
    updateHearts();
    loop();
  </script>
</body>

</html>
